async function loadRequisitions(force = false) {
  if (reqLoading && !force) return;
  reqLoading = true;
  
  try {
    const cached = JSON.parse(localStorage.getItem('forge_cached_requests') || '{}');
    if (cached && Array.isArray(cached.items) && cached.items.length) {
      requisitions = cached.items;
      if (cached.headers) requisitionsHeaders = cached.headers;
      lastReqSync = cached.updatedAt;
    }
  } catch (e) {}

  if (!requisitions.length) {
    requisitions = seedInitialRequisitions();
    saveRequisitionsCache();
  }

  if (window.StockFlowAPI) {
    try {
      const res = await window.StockFlowAPI.getAllRequests();
      if (res && res.success && Array.isArray(res.data) && res.data.length) {
        const activeList = [];
        res.data.forEach(r => {
          if (r.status === 'ปฏิเสธ' || r.status === 'ไม่อนุมัติ') {
            const alreadyInHistory = state.transactions.some(t => t.referenceNo === r.id && t.type === 'REJECT');
            if (!alreadyInHistory) {
              state.transactions.push({
                id: 'REJ-' + (r.id ? r.id.replace(/[^a-zA-Z0-9]/g, '') : Date.now().toString(36).toUpperCase()),
                timestamp: r.timestamp || new Date().toISOString(),
                type: 'REJECT',
                itemId: 'P001',
                customItemName: r.product,
                size: r.size || 'FREE',
                qty: Number(r.qty) || 1,
                before: 0,
                after: 0,
                delta: 0,
                factoryId: '',
                factoryName: r.factory || r.region,
                recipientName: r.requester,
                department: r.department,
                referenceNo: r.id,
                note: `[ปฏิเสธจาก Google Sheets] ${r.note || 'ไม่อนุมัติ'} (ผู้ขอ: ${r.requester})`,
                operator: r.approver || 'แอดมิน'
              });
              saveLocal();
            }
          } else {
            activeList.push(r);
          }
        });
        requisitions = activeList;
        if (res.headers) requisitionsHeaders = res.headers;
        lastReqSync = new Date().toISOString();
        saveRequisitionsCache();
        if (page === 'requisitions') render();
      }
    } catch (e) {
      console.warn('[REQUISITIONS SYNC]', e.message);
    }
  }
  reqLoading = false;
  drawSidebar();
}

function rebuildBalances(){
  const b={};
  state.transactions.forEach(t=>{
    b[key(t.itemId,t.size)]=(b[key(t.itemId,t.size)]||0)+Number(t.delta);
  });
  state.balances=b;
}

function stock(id,size){return Number(state.balances[key(id,size)]||0)}
function productTotal(item){return item.sizes.reduce((sum,s)=>sum+stock(item.id,s),0)}
function lowVariants(){return state.items.filter(x=>x.active).flatMap(p=>p.sizes.map(size=>({item:p,size,qty:stock(p.id,size),min:p.minimum})).filter(x=>x.qty<=x.min)).sort((a,b)=>(a.qty-a.min)-(b.qty-b.min));}
function factoryOutstanding(itemId,size,factoryId){return state.transactions.reduce((sum,t)=>t.itemId===itemId && t.size===size && t.factoryId===factoryId ? sum+(t.type==='OUT'?Number(t.qty):t.type==='RETURN'?-Number(t.qty):0):sum,0)}
function recent(days){return days===0?state.transactions:state.transactions.filter(t=>new Date(t.timestamp).getTime()>=Date.now()-days*86400000)}
function issueTotal(tx){return tx.reduce((sum,t)=>sum+(t.type==='OUT'?Number(t.qty):t.type==='RETURN'?-Number(t.qty):0),0)}
function dateMonth(tx){const d=new Date(tx.timestamp);return new Intl.DateTimeFormat('en-US',{year:'numeric',month:'2-digit',timeZone:'Asia/Bangkok'}).format(d)===new Intl.DateTimeFormat('en-US',{year:'numeric',month:'2-digit',timeZone:'Asia/Bangkok'}).format(new Date())}
function metrics(){return {total:state.items.filter(x=>x.active).reduce((n,p)=>n+productTotal(p),0),products:state.items.filter(x=>x.active).length,low:lowVariants().length,issued:issueTotal(state.transactions.filter(dateMonth))};}
function facName(id){return byId(state.factories,id)?.name||'—'}
function itemName(id){return byId(state.items,id)?.name||'ไม่พบสินค้า'}
function typeBadge(type){
  if(type==='REJECT') return `<span class="pill danger" style="background:#4a151b;color:#ff8595;border-color:#ff4d6d;font-weight:600">ปฏิเสธ</span>`;
  return `<span class="pill ${type==='IN'?'success':type==='OUT'?'warn':type==='RETURN'?'purple':''}">${TYPE_LABEL[type]||type}</span>`;
}

/**
 * ฟังก์ชันประมวลผลคำถามของ AI Inventory Copilot
 */
function handleCopilotQuery(query) {
  const lowList = lowVariants();
  const last30 = recent(30);
  const m = metrics();
  const factoryUsage = {};
  last30.filter(t => t.type === 'OUT' && t.factoryId).forEach(t => {
    factoryUsage[t.factoryId] = (factoryUsage[t.factoryId] || 0) + t.qty;
  });
  const topFactories = Object.entries(factoryUsage).sort((a,b) => b[1] - a[1]);
  const q = String(query||'').trim().toLowerCase();

  if (q === 'lowstock' || q.includes('ใกล้หมด') || q.includes('สต็อกต่ำ') || q.includes('เสี่ยง')) {
    const itemsText = lowList.slice(0, 5).map((x, i) => `${i+1}. <b>${x.item.name}</b> (${x.size}) คงเหลือ <b>${fmt(x.qty)}</b> ${x.item.unit} (ขั้นต่ำ ${x.min})`).join('<br>');
    copilotAnswer = {
      title: `⚡ สินค้าที่ถึงจุดเสี่ยง (${lowList.length} รายการ)`,
      text: `ตรวจพบสินค้า/ไซซ์ที่ต่ำกว่าหรือเท่ากับจุดสั่งซื้อขั้นต่ำ:<br>${itemsText}${lowList.length > 5 ? `<br><small style="color:#77d9ff">...และอีก ${lowList.length - 5} รายการ</small>` : ''}`
    };
  } else if (q === 'recommend' || q.includes('เติม') || q.includes('สั่งซื้อ')) {
    const a = analysis(30, 'ALL');
    const recs = a.suggests.slice(0, 4).map((x, i) => `${i+1}. <b>${x.item.name}</b> (${x.size}) แนะนำเติม <b>${fmt(x.recommended)}</b> ${x.item.unit}`).join('<br>');
    copilotAnswer = {
      title: '📦 คำแนะนำการเติมสต็อก (คำนวณจากยอดเบิกจริง + สำรอง)',
      text: recs || 'ขณะนี้ระดับสต็อกเพียงพอต่อความต้องการ ยังไม่มีรายการวิกฤติ'
    };
  } else if (q === 'topfactory' || q.includes('โรงงาน') || q.includes('เบิกมากสุด')) {
    const topText = topFactories.slice(0, 4).map(([fid, q], i) => `${i+1}. <b>${facName(fid)}</b> (${byId(state.factories, fid)?.region||'—'}) เบิกสุทธิ <b>${fmt(q)}</b> หน่วย`).join('<br>');
    copilotAnswer = {
      title: '🏭 โรงงานปลายทางที่มีการเบิกจ่ายสูงสุด (30 วัน)',
      text: topText || 'ยังไม่มีประวัติการเบิกออกในรอบ 30 วัน'
    };
  } else if (q === 'summary' || q.includes('สรุป') || q.includes('ภาพรวม')) {
    copilotAnswer = {
      title: '📊 สรุปสุขภาพคลังสินค้ากลาง (System Health)',
      text: `• สินค้าคงเหลือรวม: <b>${fmt(m.total)}</b> หน่วย<br>• ทะเบียนสินค้า: <b>${m.products}</b> SKU ใน 23 โรงงาน<br>• สินค้าจุดเสี่ยง: <b>${m.low}</b> รายการ (ระดับสุขภาพ 50%)<br>• ยอดเบิกสุทธิเดือนนี้: <b>${fmt(m.issued)}</b> หน่วย`
    };
  } else {
    const matchedItems = state.items.filter(i => i.name.toLowerCase().includes(q) || i.sku.toLowerCase().includes(q));
    const matchedFacs = state.factories.filter(f => f.name.toLowerCase().includes(q) || f.region.toLowerCase().includes(q));
    if (matchedItems.length) {
      const info = matchedItems.slice(0, 3).map(p => {
        const sizesStr = p.sizes.map(s => `${s}: ${fmt(stock(p.id, s))}`).join(' | ');
        return `• <b>${p.name}</b> (${p.sku}) รวม ${fmt(productTotal(p))} ${p.unit}<br><small style="color:#7ee0ff">ไซซ์: ${sizesStr}</small>`;
      }).join('<br><br>');
      copilotAnswer = { title: `🔍 ผลวิเคราะห์สินค้า "${esc(query)}"`, text: info };
    } else if (matchedFacs.length) {
      const f = matchedFacs[0];
      const fIssued = issueTotal(state.transactions.filter(t => t.factoryId === f.id));
      copilotAnswer = {
        title: `🏭 ข้อมูล ${esc(f.name)} (${esc(f.region)})`,
        text: `• รหัสโรงงาน: <b>${f.id}</b><br>• ยอดเบิกสะสมรวม: <b>${fmt(fIssued)}</b> หน่วย<br>• สภาพเครือข่าย: เชื่อมต่อคลังกลางเรียบร้อย`
      };
    } else {
      copilotAnswer = {
        title: `🤖 คำตอบสำหรับ "${esc(query)}"`,
        text: `จากข้อมูลในคลังกลาง มีสินค้าคงเหลือรวม ${fmt(m.total)} หน่วย โดยมี 11 รายการที่ถึงจุดเสี่ยง คุณสามารถคลิกหัวข้อลัดด้านบนเพื่อดูข้อมูลวิเคราะห์เจาะลึกได้ครับ`
      };
    }
  }
}

function productEmoji(cat,name=''){
  if(name.includes('ถุงมือ'))return '🧤';
  if(name.includes('ไฟฉาย'))return '🔦';
  if(name.includes('รองเท้า'))return '🥾';
  if(name.includes('หมวกคลุมผม'))return '🧢';
  if(cat.includes('กางเกง'))return '👖';
  if(cat.includes('เสื้อ'))return '👕';
  if(cat.includes('หมวก')||cat.includes('PPE'))return '⛑️';
  if(cat.includes('ปลอกแขน'))return '🧤';
  if(cat.includes('อุปกรณ์'))return '🧰';
  return '📦';
}

function analysis(days,region){
  const filtered=recent(days).filter(t=>region==='ALL'||byId(state.factories,t.factoryId)?.region===region),outs=filtered.filter(t=>t.type==='OUT'),returns=filtered.filter(t=>t.type==='RETURN'),net=issueTotal(filtered),byProduct={};
  outs.forEach(t=>{byProduct[t.itemId]=(byProduct[t.itemId]||0)+t.qty});
  returns.forEach(t=>{byProduct[t.itemId]=(byProduct[t.itemId]||0)-t.qty});
  const top=Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const usageFor=(itemId,size)=>recent(30).reduce((n,t)=>t.itemId===itemId&&t.size===size?n+(t.type==='OUT'?t.qty:t.type==='RETURN'?-t.qty:0):n,0);
  const suggests=lowVariants().map(v=>{const monthly=Math.max(0,usageFor(v.item.id,v.size)),recommended=Math.max(0,Math.ceil(monthly/30*14+v.min-v.qty));return {...v,monthly,recommended}}).filter(x=>x.recommended>0).sort((a,b)=>b.recommended-a.recommended);
  return {outs,returns,net,top,suggests,filtered};
}

function matchingDocs(){
  let tx=state.transactions.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  if(docsFactory!=='ALL')tx=tx.filter(t=>t.factoryId===docsFactory);
  if(docsType!=='ALL')tx=tx.filter(t=>t.type===docsType);
  if(docsDays)tx=tx.filter(t=>new Date(t.timestamp)>=new Date(Date.now()-docsDays*86400000));
  return tx;
}

/**
 * หน้าต่างตรวจสอบข้อมูลสดจาก API (Live Inspector & Raw JSON Viewer)
 */
async function openLiveInspector(action = 'getRequests', factory = 'โรงงานบางพลี') {
  showModal(`
    <div class="modal-header">
      <div>
        <div class="eyebrow">LIVE API INSPECTOR</div>
        <h2>ตรวจสอบข้อมูลสดจาก Google Apps Script API</h2>
        <p class="hint">แสดงโครงสร้าง JSON และข้อมูลดิบที่ส่งข้าม API อย่างโปร่งใส</p>
      </div>
      <button class="icon-button" data-action="closeModal">${ico('x')}</button>
    </div>
    
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn small ${action==='getRequests'&&factory==='โรงงานบางพลี'?'primary':''}" data-action="inspectCall" data-inspect-action="getRequests" data-inspect-factory="โรงงานบางพลี">getRequests (บางพลี)</button>
      <button class="btn small ${action==='getRequests'&&factory==='โรงงานชลบุรี'?'primary':''}" data-action="inspectCall" data-inspect-action="getRequests" data-inspect-factory="โรงงานชลบุรี">getRequests (ชลบุรี)</button>
      <button class="btn small ${action==='getRequests'&&factory==='โรงงานรังสิต'?'primary':''}" data-action="inspectCall" data-inspect-action="getRequests" data-inspect-factory="โรงงานรังสิต">getRequests (รังสิต)</button>
      <button class="btn small ${action==='getStock'?'primary':''}" data-action="inspectCall" data-inspect-action="getStock" data-inspect-factory="โรงงานบางพลี">getStock (สต็อกบางพลี)</button>
      <button class="btn small ${action==='ping'?'primary':''}" data-action="inspectCall" data-inspect-action="ping">Ping (ตรวจสุขภาพ)</button>
    </div>

    <div id="inspectorLoading" style="padding:25px;text-align:center;color:#6ed8ff">
      ${ico('refresh','spinning')} กำลังส่ง Request ไปยัง Google Apps Script...
    </div>

    <div id="inspectorContent" style="display:none">
      <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:#85a6ba"><b>URL ที่ยิง:</b> <span id="inspectUrl" style="word-break:break-all;color:#41ddff"></span></span>
        <span class="pill" id="inspectLatency"></span>
      </div>
      
      <div style="margin-bottom:10px">
        <b style="font-size:11px;color:#a2c9df">โครงสร้างคอลัมน์ (Headers):</b>
        <div id="inspectHeaders" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px"></div>
      </div>

      <div style="margin-top:10px">
        <b style="font-size:11px;color:#a2c9df">ข้อมูล JSON ที่ส่งกลับมา (Raw Response):</b>
        <div class="raw-code-box" id="inspectRawJson"></div>
      </div>
    </div>
    
    <div class="action-row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn flat" data-action="closeModal">ปิด</button>
      <button class="btn primary" data-action="copyInspectorJson">${ico('clipboard')} คัดลอก JSON</button>
    </div>
  `);

  try {
    let result;
    const t0 = performance.now();
    if (action === 'getRequests') result = await window.StockFlowAPI.getRequests(factory);
    else if (action === 'getStock') result = await window.StockFlowAPI.getStock(factory);
    else if (action === 'ping') {
      const url = new URL(window.StockFlowAPI.getEndpoint());
      url.searchParams.set('action', 'ping');
      const r = await fetch(url.toString());
      result = await r.json();
    }
    const elapsed = Math.round(performance.now() - t0);

    const loader = document.querySelector('#inspectorLoading');
    const content = document.querySelector('#inspectorContent');
    if (loader) loader.style.display = 'none';
    if (content) content.style.display = 'block';

    const urlDisplay = document.querySelector('#inspectUrl');
    const latDisplay = document.querySelector('#inspectLatency');
    const headersDisplay = document.querySelector('#inspectHeaders');
    const rawDisplay = document.querySelector('#inspectRawJson');

    const ep = new URL(window.StockFlowAPI.getEndpoint());
    ep.searchParams.set('action', action);
    if (factory && action !== 'ping') ep.searchParams.set('factory', factory);

    if (urlDisplay) urlDisplay.textContent = ep.toString();
    if (latDisplay) latDisplay.textContent = `${elapsed} ms`;
    
    if (headersDisplay) {
      if (result && Array.isArray(result.headers)) {
        headersDisplay.innerHTML = result.headers.map((h, i) => `<span class="pill" style="font-size:9.5px">${i+1}. ${esc(h)}</span>`).join('');
      } else {
        headersDisplay.innerHTML = '<span class="hint">ไม่มีข้อมูล headers</span>';
      }
    }

    if (rawDisplay) {
      rawDisplay.textContent = JSON.stringify(result, null, 2);
    }
  } catch (err) {
    const loader = document.querySelector('#inspectorLoading');
    if (loader) {
      loader.innerHTML = `<span style="color:var(--red)">เกิดข้อผิดพลาดในการเรียก API: ${esc(err.message)}</span>`;
    }
  }
}

function addSimProductRow() {

  const div = document.createElement('div');
  div.className = 'sim-prod-row';
  div.dataset.rowId = String(rowId);
  div.innerHTML = `
    <div>

      <select class="sim-prod-select" onchange="handleSimProductChange(${rowId})" required>

function removeSimProductRow(rowId) {
  const rows = document.querySelectorAll('.sim-prod-row');
  if (rows.length <= 1) {
    toast('ต้องมีรายการสินค้าอย่างน้อย 1 รายการ', true);
    return;
  }
  const row = document.querySelector(`.sim-prod-row[data-row-id="${rowId}"]`);
  if (row) row.remove();
  updateLiveReqPayload();
}

function handleSimProductChange(rowId) {
  const row = document.querySelector(`.sim-prod-row[data-row-id="${rowId}"]`);
  if (!row) return;
  const prodSelect = row.querySelector('.sim-prod-select');
  const sizeSelect = row.querySelector('.sim-size-select');
  if (!prodSelect || !sizeSelect) return;
  const p = PRODUCT_MASTER.find(x => x.name === prodSelect.value) || PRODUCT_MASTER[0];
  sizeSelect.innerHTML = p.sizes.map(s => `<option value="${s}">${s}</option>`).join('');
  updateLiveReqPayload();

async function submitNewRequisition() {
  const fac = document.getElementById('reqFormFactory')?.value;
  const dept = document.getElementById('reqFormDept')?.value;
  const requester = document.getElementById('reqFormRequester')?.value;
  const note = document.getElementById('reqFormNote')?.value;

  const rows = document.querySelectorAll('.sim-prod-row');
  const products = [];
  rows.forEach(r => {

    const size = r.querySelector('.sim-size-select')?.value;

  });

  if (btn) {

    btn.innerHTML = `${ico('refresh', 'spinning')} กำลังส่งข้อมูลไปยัง Google Apps Script...`;
  }

  try {
    const t0 = performance.now();
    let response;
    if (window.StockFlowAPI && typeof window.StockFlowAPI.saveRequest === 'function') {
      response = await window.StockFlowAPI.saveRequest(payload);
    } else {
      await new Promise(r => setTimeout(r, 400));
      response = {
        success: true,
        message: 'บันทึกคำขอเบิกเรียบร้อยแล้ว',

    const nowTh = new Intl.DateTimeFormat('th-TH', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Asia/Bangkok' }).format(new Date());
    const newItems = products.map((p, idx) => ({
      id: `${response.requestId || 'REQ'}-${idx + 1}`,

      size: p.size,
      qty: p.quantity,
      note: note,
      status: 'รออนุมัติ',
      approver: '',

        action: 'saveRequest',
        factory: fac,
        department: dept,
        requester: requester,
        products: [p],
        note: note

    requisitions.unshift(...newItems);

    if (resultBox) {
      resultBox.style.display = 'block';

        <div style="background:#092e21;border:1px solid #1a825b;border-radius:10px;padding:12px;margin-top:10px">

            <span class="pill" style="background:#134433;color:#85ffd4">HTTP 200 OK</span>
          </div>
          <p style="font-size:11px;color:#c9f9e7;margin:0 0 8px 0">${esc(response.message)} (รหัส ${esc(response.requestId)})</p>

function doRejectRequisition(reqId, reason) {
  const req = requisitions.find(r => r.id === reqId);
  if (!req) {
    closeModal();
    return;
  }
  
  const matched = state.items.find(i => 
    i.name.includes(req.product) || 
    req.product.includes(i.name) || 
    i.sku.toLowerCase() === (req.product || '').toLowerCase()
  ) || state.items[0];
  
  const size = (matched && matched.sizes.includes(req.size)) ? req.size : (matched?.sizes[0] || req.size || 'FREE');
  const fac = state.factories.find(f => f.name.includes(req.factory) || f.region.includes(req.region || req.factory));
  const currentStock = stock(matched.id, size);
  
  // 1. บันทึกลงในประวัติ (Audit Trail / Transactions) ว่า "ปฏิเสธ" (ไม่ตัดสต็อก delta = 0)
  const rejTx = {
    id: 'REJ-' + Date.now().toString(36).toUpperCase(),
    timestamp: new Date().toISOString(),
    type: 'REJECT',
    itemId: matched.id,
    customItemName: req.product,
    size: size,
    qty: Number(req.qty) || 1,
    before: currentStock,
    after: currentStock,
    delta: 0,
    factoryId: fac ? fac.id : '',
    factoryName: req.factory || req.region,
    recipientName: req.requester,
    department: req.department,
    referenceNo: req.id,
    note: `[ปฏิเสธคำขอเบิก] ${reason} (ผู้ขอ: ${req.requester}, แผนก: ${req.department || '—'})`,
    operator: 'แอดมินคลังกลาง',
    rejectReason: reason,
    originalReq: { ...req, rejectedAt: new Date().toISOString(), rejectReason: reason }
  };
  
  state.transactions.push(rejTx);
  state.rejectedHistory = state.rejectedHistory || [];
  state.rejectedHistory.push(rejTx.originalReq);
  saveLocal();
  
  // 2. ลบออกจากตารางคำขอเบิกไปเลย (ลบสดจาก active requisitions)
  requisitions = requisitions.filter(r => r.id !== reqId);
  saveRequisitionsCache();
  
  closeModal();
  render();
  toast(`ปฏิเสธคำขอเบิก ${req.id} แล้ว (ลบออกจากตาราง และขึ้นในประวัติว่า "ปฏิเสธ")`);
}

async function handleImage(file){
  if(!file)return;
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast('รองรับเฉพาะ JPG, PNG และ WebP',true);return}
  if(file.size>15*1024*1024){toast('ไฟล์รูปใหญ่เกิน 15MB',true);return}
  try{
    const img=new Image();
    const url=URL.createObjectURL(file);
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
    const max=600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
    canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
    const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    photoData=canvas.toDataURL('image/jpeg',.73);
    URL.revokeObjectURL(url);
    document.querySelector('#imagePreview').innerHTML=`<img src="${photoData}" alt="ตัวอย่างรูปภาพ"><small>เปลี่ยนรูปได้โดยแตะอีกครั้ง</small>`;
  }catch(e){toast('เปิดไฟล์รูปภาพไม่ได้',true)}
}

async function saveProduct(form){
  const values=new FormData(form),sizes=[...form.querySelectorAll('.sizeOption:checked')].map(x=>x.value),obj={id:editingItemId||'',sku:String(values.get('sku')||'').trim().toUpperCase(),name:String(values.get('name')||'').trim(),category:values.get('category'),unit:values.get('unit'),sizes,minimum:Number(values.get('minimum')),description:String(values.get('description')||''),imageData:photoData};
  if(!obj.sku||!obj.name||!sizes.length){toast('กรุณากรอกข้อมูลสินค้าและเลือกไซซ์',true);return}
  if(!/^[A-Z0-9._-]+$/.test(obj.sku)){toast('รหัสสินค้าใช้ A-Z, 0-9, จุด, - หรือ _ เท่านั้น',true);return}
  if(!Number.isSafeInteger(obj.minimum)||obj.minimum<0){toast('จุดแจ้งเตือนต้องเป็นจำนวนเต็มไม่ติดลบ',true);return}
  if(busy)return;
  busy=true;
  const submit=form.querySelector('[type=submit]');
  submit.disabled=true;
  try{
    if(state.items.some(x=>x.sku.toUpperCase()===obj.sku&&x.id!==obj.id))throw new Error('รหัสสินค้าซ้ำ');
    const old=byId(state.items,obj.id);
    obj.id=obj.id||'PRD-'+Date.now().toString(36).toUpperCase();
    obj.imageFileId=obj.imageData?'DEMO-'+obj.id:old?.imageFileId||'';
    obj.active=true;
    obj.updatedAt=new Date().toISOString();
    if(obj.imageData){
      imageCache[obj.imageFileId]=obj.imageData;
      state.demoImages=state.demoImages||{};
      state.demoImages[obj.imageFileId]=obj.imageData;
    }
    delete obj.imageData;
    if(old)Object.assign(old,obj);else state.items.push(obj);
    saveLocal();
    closeModal();
    render();
    toast('บันทึกข้อมูลสินค้าเรียบร้อย');
  }catch(e){
    toast(e.message||'ไม่สามารถบันทึกสินค้า',true);
  }finally{
    busy=false;
    submit.disabled=false;
  }
}

  const size=sizeEl.value,fac=facEl.value,available=item&&size?stock(item.id,size):0,qty=Number(qtyEl.value)||0,remain=available+(txType==='IN'||txType==='RETURN'?qty:txType==='OUT'?-qty:qty-available);

  document.querySelector('#transactionHeading').textContent='บันทึก'+TYPE_LABEL[txType];
  document.querySelector('#txAvailable').textContent=item&&size?fmt(available):'—';
  document.querySelector('#summaryItem').textContent=item?.name||'—';

}

function updateQtyOnly(){

  const item=byId(state.items,form.querySelector('#txItem').value),s=form.querySelector('#txSize').value,qty=Number(form.querySelector('#txQty').value)||0,available=item&&s?stock(item.id,s):0,after=txType==='COUNT'?qty:available+(txType==='OUT'?-qty:qty);
  document.querySelector('#summaryAfter').textContent=item&&s?fmt(after):'—';
  document.querySelector('#summaryAfter').style.color=after<0?'var(--red)':'var(--aqua)';
}

async function transact(form){
  const data=new FormData(form),obj={
    type:txType,
    itemId:String(data.get('itemId')),
    size:String(data.get('size')),
    qty:Number(data.get('qty')),
    factoryId:txType==='OUT'||txType==='RETURN'?String(data.get('factoryId')):'',
    note:String(data.get('note')||'').trim(),
    referenceNo:String(data.get('referenceNo')||'').trim(),
    recipientName:String(data.get('recipientName')||'').trim(),
    department:String(data.get('department')||'').trim(),
    operator:String(data.get('operator')||'').trim()
  };
  const item=byId(state.items,obj.itemId),before=stock(obj.itemId,obj.size);
  if(!item||!item.sizes.includes(obj.size)){toast('กรุณาเลือกสินค้าและไซซ์',true);return}
  if(!Number.isSafeInteger(obj.qty)||obj.qty<0||obj.qty>1000000||(obj.type!=='COUNT'&&obj.qty===0)){toast('กรุณากรอกจำนวนเต็มที่ถูกต้อง',true);return}
  if((obj.type==='OUT'||obj.type==='RETURN')&&!byId(state.factories,obj.factoryId)){toast('กรุณาเลือกโรงงาน',true);return}
  if(obj.type==='OUT'&&obj.qty>before){toast('สต็อกคงเหลือไม่เพียงพอสำหรับการเบิก',true);return}
  if(obj.type==='RETURN'&&obj.qty>factoryOutstanding(obj.itemId,obj.size,obj.factoryId)){toast('จำนวนคืนเกินยอดเบิกสุทธิของโรงงานนี้',true);return}
  if(obj.type==='COUNT'&&!obj.note){toast('การตรวจนับต้องระบุเหตุผลในการปรับยอด',true);return}
  
  if(busy)return;
  busy=true;
  const submit=form.querySelector('[type=submit]');
  submit.disabled=true;
  try{
    const delta=txType==='COUNT'?obj.qty-before:txType==='OUT'?-obj.qty:obj.qty;
    const newTx={
      ...obj,
      id:'TX-'+Date.now().toString(36).toUpperCase(),
      timestamp:new Date().toISOString(),
      before,
      after:before+delta,
      delta
    };
    state.transactions.push(newTx);
    rebuildBalances();
    saveLocal();

    lastTransactionId=newTx.id;
    form.reset();
    render();
    toast('บันทึก'+TYPE_LABEL[obj.type]+'สำเร็จ • ยอดคงเหลืออัปเดตแล้ว');
    showPrintSuccess(lastTransactionId);
  }catch(e){
    toast(e.message||'บันทึกไม่สำเร็จ',true);
  }finally{
    busy=false;
    submit.disabled=false;
  }
}

function csvCell(v){return '"'+String(v==null?'':v).replaceAll('"','""')+'"'}
function downloadText(name,content,mime='text/csv;charset=utf-8'){
  const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}
function exportCSV(name,headers,rows){
  downloadText(name,'\uFEFF'+[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'));
}

          <button class="btn flat" data-action="closeModal">ยกเลิก</button>
          <button class="btn danger" data-action="confirmSetZero" style="background:#701925;border-color:#b9283c;color:#fff">
            ${ico('trash')} ยืนยัน Set Zero เป็น 0 ทั้งหมด
          </button>
        </div>
      `);
      break;
    }
    case 'confirmSetZero': {
      state.balances = {};
      state.transactions = [];
      state.isZeroedOut = true;
      state.mode = 'prod';
      saveLocal();
      closeModal();
      render();
      toast('Set Zero ยอดอุปกรณ์เป็น 0 เรียบร้อยแล้ว ระบบพร้อมให้แอดมินกรอกสต็อกจริง');
      break;
    }
    case 'quickCount': {
      txType = 'COUNT';
      go('transactions');
      toast('เข้าสู่หน้าตรวจนับสต็อก (COUNT) กรุณาเลือกสินค้าและกรอกยอดจริง');
      break;
    }
    case 'quickCountItem': {
      txType = 'COUNT';
      pendingTxItem = a.dataset.id;
      go('transactions');
      toast('เลือกสินค้าสำหรับตรวจนับยอดจริง (COUNT) แล้ว');
      break;
    }
    case 'fulfillReq': {
      const reqId = a.dataset.id;
      const req = requisitions.find(r => r.id === reqId);
      if (req) {
        txType = 'OUT';
        const matched = state.items.find(i => i.name.includes(req.product) || req.product.includes(i.name));
        if (matched) pendingTxItem = matched.id;
        go('transactions');
        setTimeout(() => {
          const fItem = document.querySelector('#txItem');
          const fSize = document.querySelector('#txSize');
          const fQty = document.querySelector('#txQty');
          const fFac = document.querySelector('#txFactory');
          const fRec = document.querySelector('input[name="recipientName"]');
          const fDept = document.querySelector('input[name="department"]');
          const fNote = document.querySelector('#txNote');
          const fRef = document.querySelector('input[name="referenceNo"]');
          
          if (matched && fItem) fItem.value = matched.id;
          updateTransactionHints();
          if (fSize && req.size) fSize.value = req.size;
          if (fQty) fQty.value = req.qty;
          if (fRec) fRec.value = req.requester;
          if (fDept) fDept.value = req.department;
          if (fNote) fNote.value = `ตัดจ่ายตามคำขอเบิก ${req.id} (${req.factory || req.region})`;
          if (fRef) fRef.value = req.id;
          if (fFac) {
            const facOpt = Array.from(fFac.options).find(o => o.text.includes(req.factory) || o.text.includes(req.region));
            if (facOpt) fFac.value = facOpt.value;
          }
          updateTransactionHints();
          toast(`โหลดข้อมูลคำขอเบิก ${req.id} สำหรับตัดจ่ายแล้ว`);
        }, 120);
      }
      break;
    }
    case 'checkApi': {
      toast('กำลังทดสอบการเชื่อมต่อ API...');
      if(window.StockFlowAPI){
        const ok = await window.StockFlowAPI.checkConnection();
        if(ok){
          toast(`เชื่อมต่อ API สำเร็จ (${window.StockFlowAPI.latency}ms)`);
        } else {
          toast('ไม่สามารถเชื่อมต่อ API ได้ (ใช้ Local Cache)', true);
        }
      }
      break;
    }
    case 'saveApiUrl': {
      const input = document.querySelector('#settingApiUrl');
      if(input && input.value.trim()){
        if(window.StockFlowAPI){
          window.StockFlowAPI.setEndpoint(input.value.trim());
          toast('บันทึก API URL เรียบร้อย');
        }
      }
      break;
    }
    case 'showAlerts': alertDialog(); break;
    case 'toLow': closeModal(); inventoryStatus='LOW'; go('inventory'); break;
    case 'newItem': editItem(); break;
    case 'editItem': editItem(a.dataset.id); break;
    case 'closeModal': closeModal(); break;
    case 'quickIn': txType='IN'; go('transactions'); break;
    case 'quickOut': txType='OUT'; go('transactions'); break;
    case 'quickItem': txType='OUT'; pendingTxItem=a.dataset.id; go('transactions'); break;
    case 'exportReport': exportReport(); break;
    case 'exportRequisitions': exportRequisitions(); break;
    case 'printTx': openPrint('tx',a.dataset.id); break;
    case 'printStock': openPrint('stock'); break;
    case 'printHistory': openPrint('history'); break;
    case 'printReport': openPrint('report'); break;
    case 'exportStock': exportStock(); break;
    case 'exportHistory': exportHistory(); break;
    case 'exportFactories': exportFactories(); break;
    case 'backupJson': backupJson(); break;
    case 'resetDemoConfirm': confirmResetDemo(); break;
    case 'doResetDemo': {
      localStorage.removeItem(DEMO_KEY);
      localStorage.removeItem('forge_cached_requests');
      state=seedDemo();
      requisitions=[];
      imageCache={};
      saveLocal();
      closeModal();
      go('dashboard');
      toast('รีเซ็ตข้อมูลตัวอย่างแล้ว');
      break;
    }
    case 'reload': boot(); break;
    case 'resetForm': setTimeout(updateTransactionHints,0); break;
  }
});

document.addEventListener('change',e=>{
  const t=e.target;
  switch(t.id){
    case 'reqFactorySelect': reqFactoryFilter = t.value; render(); break;
    case 'reqStatusSelect': reqStatusFilter = t.value; render(); break;
    case 'inventoryCat': inventoryCat=t.value; render(); break;
    case 'inventoryStatus': inventoryStatus=t.value; render(); break;
    case 'historyType': historyType=t.value; render(); break;
    case 'docsFactory': docsFactory=t.value; render(); break;
    case 'docsType': docsType=t.value; render(); break;
    case 'docsDays': docsDays=Number(t.value); render(); break;
    case 'reportDays': reportDays=Number(t.value); render(); break;
    case 'reportRegion': reportRegion=t.value; render(); break;
    case 'txItem': {
      const size=document.querySelector('#txSize');
      if(size)size.value='';
      updateTransactionHints();
      break;
    }
    case 'txSize': case 'txFactory': updateTransactionHints(); break;
    case 'imageInput': handleImage(t.files?.[0]); break;
    case 'itemCategory': {
      const inputs=[...document.querySelectorAll('.sizeOption')];
      if(inputs.length){
        const oneSize=['หมวก','ปลอกแขน','อุปกรณ์','อุปกรณ์ PPE','อื่น ๆ'].includes(t.value);
        inputs.forEach(i=>i.checked=oneSize?i.value==='FREE':['S','M','L','XL','2XL'].includes(i.value));
      }
      break;
    }
  }
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='reqSearchInput'){
    reqSearch=t.value;
    const pos=t.selectionStart;
    render();
    const inp=document.querySelector('#reqSearchInput');
    inp?.focus();
    inp?.setSelectionRange(pos,pos);
    return;
  }
  if(t.id==='txQty'){updateQtyOnly();return}
  if(t.id==='inventorySearch'){
    inventoryQuery=t.value;
    const pos=t.selectionStart;
    render();
    const inp=document.querySelector('#inventorySearch');
    inp?.focus();
    inp?.setSelectionRange(pos,pos);
  }
  if(t.id==='historySearch'){
    historyQuery=t.value;
    const pos=t.selectionStart;
    render();
    const inp=document.querySelector('#historySearch');
    inp?.focus();
    inp?.setSelectionRange(pos,pos);
  }
});

document.addEventListener('submit',e=>{
  if(e.target.id==='copilotForm'){
    e.preventDefault();
    const input = document.querySelector('#copilotQueryInput');
    if(input && input.value.trim()){
      handleCopilotQuery(input.value.trim());
      render();
    }
    return;
  }
  if(e.target.id==='itemForm'){
    e.preventDefault();
    saveProduct(e.target);
  }
  if(e.target.id==='transactionForm'){
    e.preventDefault();
    transact(e.target);
  }
});

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    go('inventory');
    setTimeout(()=>document.querySelector('#inventorySearch')?.focus(),0);
  }
  if(e.key==='Escape')closeModal();
});

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
</body>
</html>
